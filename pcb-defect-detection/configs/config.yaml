data:
  raw_dir: data/raw/DeepPCB/PCBData
  splits_dir: data/processed/splits
  image_size: 640
  classes: [open, short, mousebite, spur, copper, pin-hole]
  val_groups: [group44000, group50600, group77000]
  coco_dir: data/processed/coco/annotations
baseline:
  kernel_sizes: [3, 5, 7]
  margins: [9, 12, 15, 18, 21, 24, 30]
  max_shift_search: 8
  max_shift_valid: 3
  shifts_file: data/processed/train_shifts.csv
  board_thresholds: [1, 10, 25, 50, 100, 200, 400]
  seed: 42
final:
  experiment: pcb_yolox_s_neg_e50
  ensemble_seeds: [0, 1]
  score: obj
  board_threshold: 0.81
  excluded_val_refs: ["77000016", "77000011", "77000022"]
  pending_expert_review: ["77000065"]
  latency_assumption: "GPU, 2 x YOLOX-S, about 34 ms"
  baseline_kernel: 5
  baseline_margin: 15
  v2:
    seed: 0
    min_white_pixels: 10
    board_threshold: 0.91
    preprocess: "median 3x3 + phase-correlation alignment"