data:
  raw_dir: data/raw/cfpb_hf
  raw_glob: "*.parquet"
  extracted_path: data/processed/complaints_2020-03_2021-03.parquet
  start_date: "2020-03-01"
  end_date: "2021-03-31"
  date_col: date_received
  text_col: complaint_what_happened
  columns:
    - complaint_id
    - date_received
    - product
    - sub_product
    - complaint_what_happened
clean:
  id_col: complaint_id
  label_col: product
  mask_token: "[PII]"
  train_end: "2020-12-31"
  val_end: "2021-02-28"
  out_dir: data/processed/splits
baseline:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 2
  C: 1.0
  max_iter: 1000
  report_path: reports/baseline_val.json
  model_path: models/baseline_tfidf_lr.joblib
labels:
  - Checking or savings account
  - Credit card or prepaid card
  - Credit reporting, credit repair services, or other personal consumer reports
  - Debt collection
  - Money transfer, virtual currency, or money service
  - Mortgage
  - Payday loan, title loan, or personal loan
  - Student loan
  - Vehicle loan or lease
model:
  vocab_size: 10000
  max_len: 420
  embed_dim: 64
  gru_units: 64
  encoder: attention
  embed_dropout: 0.5

train:
  seeds: [0]
  batch_size: 128
  learning_rate: 0.001
  max_epochs: 20
  patience: 3
  out_dir: models
  report_dir: reports
  train_eval_size: 26000
  train_eval_seed: 42
  seeds: [0, 1, 2, 3, 4]